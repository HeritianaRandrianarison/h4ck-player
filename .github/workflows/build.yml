name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q h4ck-player.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install && npm run build && npx cap add android && npx cap sync android
        working-directory: h4ck-player
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: h4ck-player/android
      - run: cp h4ck-player/android/app/build/outputs/apk/debug/app-debug.apk h4ck-player.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: h4ck-player.apk
